<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><title>我们的工作台 · Asteria</title><link rel="stylesheet" href="workshop.css?v=3"><script src="workshop.js?v=3" defer></script></head><body><main class="workshop"><div class="workshop-bg" aria-hidden="true"><span></span><span></span></div><header class="hero"><a class="back" href="index.html" aria-label="返回大厅">‹</a><p class="eyebrow">OUR WORKSHOP</p><h1><span>我们的工作台</span></h1><p class="subtitle">一起把想法，慢慢做出来。</p></header>
<section class="quota panel" aria-labelledby="quota-title"><div class="quota-head"><h2 id="quota-title">本周额度</h2><span class="muted">待连接</span><button class="icon-button" id="connection" aria-label="连接设置"><span class="connection-mark" aria-hidden="true"></span></button></div><div class="quota-track" aria-label="尚未连接，暂无额度数据"></div><p class="quota-caption">连接后显示剩余额度与重置时间</p></section>
<nav class="counts panel" aria-label="按项目状态筛选"><button data-filter="active" aria-pressed="true">进行中 <strong id="count-active">0</strong></button><button data-filter="review" aria-pressed="false">待确认 <strong id="count-review">0</strong></button><button data-filter="done" aria-pressed="false">已完成 <strong id="count-done">0</strong></button></nav>
<section><div class="section-head"><h2>正在一起做</h2><button class="soft-button" id="new-project">＋ 新建项目</button></div><p class="section-caption">进展、分工，还有我们下一小步。</p><div id="projects" class="projects"></div></section>
<div class="divider" aria-hidden="true"><span>♡</span></div><section><div class="section-head"><h2>施工便笺</h2><button class="soft-button outline" id="new-note">＋ 记一笔</button></div><div id="notes" class="notes"></div></section><footer>视觉原型 · 项目与便笺保存在当前设备<br>示例项目不代表实时施工状态</footer></main>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><p class="eyebrow" id="editor-kicker">A LITTLE STEP</p><button type="button" class="close icon-button" aria-label="关闭">×</button></div><h2 id="editor-title">新建项目</h2><div id="editor-fields"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="cancel soft-button outline">晚点再写</button><button type="submit" class="soft-button">收好这一笔</button></div></form></dialog>
<dialog id="detail"><div class="dialog-head"><p class="eyebrow">ON OUR WORKBENCH</p><button class="close icon-button" aria-label="关闭">×</button></div><div id="detail-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
