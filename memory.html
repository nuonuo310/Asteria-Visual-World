<style>
:root{
  color-scheme:light;
  --fog:#f9f6ea;
  --cream:#faf0e5;
  --paper:#fffdf7;
  --oat:#e4d1c2;
  --cocoa:#866657;
  --dark:#563722;
  --rose:#c58d94;
  --blue:#7f9caf;
  --snow:#d7e6eb;
  --soft:#9a7f73;
  --line:rgba(134,102,87,.17);
}
*{box-sizing:border-box}
html{background:#eee5da}
body{margin:0;color:var(--dark);font-family:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;background:#eee5da}
button,a{font:inherit;color:inherit}
button{cursor:pointer}
.page{
  position:relative;isolation:isolate;width:min(100%,520px);min-height:max(100svh,min(300vw,1560px));margin:auto;
  overflow:hidden;padding:20px 18px 112px;
  background:#fffaf4;
}
.page:before{
  content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;
  background:url("./assets/memory-bear-cream-v2.png") center top/100% auto no-repeat;
}
.page:after{content:none}
.memory-head{text-align:left;margin:3px 0 12px;padding-left:2px;transform:translateY(3px)}
.memory-head h1{margin:0;color:#73594e;font:400 italic 19px/1.3 "Baskerville","Times New Roman",serif;letter-spacing:.015em}
.memory-head p{margin:4px 0 0;color:#a38b7f;font:400 12px/1.5 "Songti SC","STSong",serif;letter-spacing:.09em}
.nebula-window{
  position:relative;width:calc(100% + 16px);margin-left:-8px;height:344px;overflow:hidden;border:1px solid rgba(134,102,87,.32);border-radius:27px;
  background:#050209;
  box-shadow:0 12px 26px rgba(86,55,34,.10);
}
.nebula-window:before{
  content:"";position:absolute;z-index:2;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(145deg,rgba(255,250,242,.035),transparent 34%,rgba(127,156,175,.035));
}
.nebula-window:after{content:none}
.galaxy-title{position:absolute;z-index:3;top:12px;left:0;right:0;margin:0;text-align:center;pointer-events:none;color:rgba(242,230,247,.76);font:400 italic 24px/1.1 "Baskerville","Times New Roman",serif;letter-spacing:.005em}
.galaxy-preview{display:block;width:100%;height:100%;border:0;pointer-events:none}
.galaxy-open{position:absolute;inset:0;z-index:4;text-decoration:none;border-radius:inherit}
.galaxy-open span{position:absolute;right:16px;bottom:15px;font-size:10px;letter-spacing:.06em;color:rgba(237,222,240,.62)}
.galaxy-open:focus-visible{outline:2px solid #d5bedc;outline-offset:-5px}
.section{margin-top:12px}
.section-title{display:flex;align-items:center;gap:10px;margin:0 0 8px;color:#73594e;font-size:15px;font-weight:400;letter-spacing:.055em}
.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(134,102,87,.13),transparent)}
.featured{
  position:relative;overflow:hidden;padding:14px 16px 14px 46px;border:1px solid rgba(151,107,89,.24);border-radius:22px;
  background:
    linear-gradient(rgba(197,141,148,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(127,156,175,.05) 1px,transparent 1px),
    #fffdf7;
  background-size:15px 15px;box-shadow:0 8px 20px rgba(86,55,34,.07);
}
.featured:after{content:"";position:absolute;width:100px;height:100px;right:-26px;bottom:-42px;border-radius:50%;background:rgba(215,230,235,.34);filter:blur(7px)}
.memory-light{position:absolute;z-index:2;left:18px;top:21px;width:15px;height:15px;border-radius:50%;background:#f5cad2;box-shadow:0 0 0 6px rgba(197,141,148,.09),0 0 17px rgba(197,141,148,.56)}
.memory-light:after{content:"";position:absolute;inset:4px;background:#fffaf2;transform:rotate(45deg);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.why{position:relative;z-index:3;margin:0 0 6px;color:#927d73;font-size:10px;letter-spacing:.04em}
.featured h3{position:relative;z-index:3;margin:0;color:#654334;font-size:17px;font-weight:600;letter-spacing:.04em}
.featured time{position:relative;z-index:3;display:block;margin-top:5px;color:#9e8074;font:10px/1.2 Arial,sans-serif;letter-spacing:.06em}
.featured blockquote{position:relative;z-index:3;margin:9px 0 0;padding-top:8px;border-top:1px solid rgba(134,102,87,.14);color:#80675c;font-size:12px;line-height:1.7}
.thread{position:relative;height:76px;margin-top:2px;padding:0 7px}
.thread svg{position:absolute;left:8%;top:14px;width:84%;height:39px;overflow:visible}
.thread path{fill:none;stroke:url(#memoryThread);stroke-width:1.25;stroke-linecap:round}
.thread-nodes{position:absolute;inset:8px 0 0;display:grid;grid-template-columns:repeat(3,1fr);align-items:start}
.thread-node{border:0;background:transparent;padding:0;text-align:center;color:#82695e;text-decoration:none}
.thread-node i{position:relative;display:grid;place-items:center;width:24px;height:24px;margin:5px auto 9px;border-radius:50%;background:#fffdf7;border:1px solid currentColor;box-shadow:0 0 0 4px rgba(255,253,247,.54),0 0 12px currentColor}
.thread-node i:after{content:"";width:7px;height:7px;background:currentColor;transform:rotate(45deg);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.thread-node:nth-child(1){color:#c58d94}.thread-node:nth-child(2){color:#b18b76}.thread-node:nth-child(3){color:#7f9caf}
.thread-node span{display:block;color:#81695e;font-size:10px;white-space:nowrap}
.recent-list{overflow:hidden;border:1px solid rgba(134,102,87,.18);border-radius:22px;background:#fffdf7;box-shadow:0 8px 20px rgba(86,55,34,.055)}
.recent-memory{position:relative;display:grid;grid-template-columns:1fr;gap:3px;min-height:68px;padding:11px 16px 10px 45px}
.recent-memory{text-decoration:none}
.recent-memory+ .recent-memory{border-top:1px solid rgba(134,102,87,.13)}
.recent-memory:before{content:"";position:absolute;left:18px;top:25px;width:10px;height:10px;border-radius:50%;background:#d8a2ab;box-shadow:0 0 0 5px rgba(197,141,148,.10),0 0 13px rgba(197,141,148,.42)}
.recent-memory:nth-child(2):before{background:#9eb7c4;box-shadow:0 0 0 5px rgba(127,156,175,.10),0 0 13px rgba(127,156,175,.42)}
.recent-top{display:flex;align-items:baseline;gap:10px}
.recent-top h3{margin:0;color:#68483f;font-size:14px;font-weight:600}.recent-top time{margin-left:auto;color:#aa8b7d;font:9px/1 Arial,sans-serif;letter-spacing:.06em}
.recent-memory p{margin:2px 0 0;color:#826b61;font-size:11px;line-height:1.55}
.archive-entry{display:flex;align-items:center;gap:13px;margin-top:12px;padding:12px 16px;border:1px solid rgba(134,102,87,.18);border-radius:21px;background:#faf0e5;box-shadow:0 7px 18px rgba(86,55,34,.05);text-decoration:none}
.archive-copy{min-width:0;flex:1}.archive-copy strong{display:block;color:#654334;font-size:16px;font-weight:600}.archive-copy small{display:block;margin-top:4px;overflow:hidden;color:#947b70;font-size:9px;text-overflow:ellipsis;white-space:nowrap}
.search-mark{position:relative;width:29px;height:29px;flex:none;border:1px solid rgba(127,156,175,.35);border-radius:50%;background:rgba(255,253,247,.72)}
.search-mark:before{content:"";position:absolute;left:7px;top:6px;width:9px;height:9px;border:1.6px solid var(--blue);border-radius:50%}.search-mark:after{content:"";position:absolute;left:17px;top:17px;width:7px;border-top:1.6px solid var(--blue);transform:rotate(46deg)}
.archive-arrow{color:#b08d7c;font-size:18px}
.dock{position:fixed;z-index:20;left:50%;bottom:max(4px,calc(env(safe-area-inset-bottom) - 8px));transform:translateX(-50%);width:min(calc(100% - 28px),492px);padding:4px;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid rgba(139,100,79,.19);border-radius:999px;background:rgba(255,251,245,.94);box-shadow:0 10px 28px rgba(76,50,41,.10);backdrop-filter:blur(16px)}
.dock a{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;text-decoration:none;color:#856a5d;font:500 9px/1 "Iowan Old Style",Georgia,serif;letter-spacing:.025em}
.dock a span{width:20px;height:20px;display:grid;place-items:center}.dock svg{width:19px;height:19px;display:block}.dock .on{background:#f4e3de;color:#674537;box-shadow:inset 0 0 0 1px rgba(197,141,148,.16)}
.dock .on span{filter:drop-shadow(0 0 5px rgba(127,156,175,.34))}
.archive-toast{position:fixed;z-index:40;left:50%;bottom:86px;transform:translate(-50%,15px);max-width:calc(100% - 48px);padding:9px 14px;border-radius:999px;background:#65483e;color:#fffaf2;font-size:10px;opacity:0;pointer-events:none;transition:.22s ease}.archive-toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:521px){.dock{width:470px}.page{box-shadow:0 0 42px rgba(86,55,34,.13)}}
@media(max-width:360px){.page{padding-inline:14px}.nebula-window{height:316px}.memory-head h1{font-size:18px}.thread-node span{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
[hidden]{display:none!important}
.featured[data-open-memory]{display:block;text-decoration:none;cursor:pointer;outline-offset:5px}
body.memory-detail-open .page>header,body.memory-detail-open .page>.nebula-window,body.memory-detail-open .page>.section,body.memory-detail-open .page>.archive-entry{display:none}
.detail-top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 25px;padding-top:6px;color:#866657}
.detail-back{border:0;background:transparent;padding:8px 0;font-size:12px;text-decoration:none}
.detail-brand{font:italic 24px/1 Didot,Georgia,serif;font-weight:400}
.detail-kicker{margin:0 0 10px;color:#ad8f7e;font:9px/1.4 Arial,sans-serif;letter-spacing:.2em}
.detail-title{margin:0 0 12px;color:#674737;font-size:25px;line-height:1.4;font-weight:400;letter-spacing:.03em;outline:none}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.detail-tags span{padding:4px 9px;border:1px solid #eadbd0;border-radius:999px;background:#fffaf4;color:#927568;font-size:10px}
.detail-tags span:first-child{background:#f5e6e4;border-color:#ebd2d3;color:#aa7680}
.detail-dates{margin:0 0 20px;color:#a1887a;font:10px/1.7 Arial,sans-serif}
.detail-paper{padding:22px 21px;border:1px solid #eadbd0;border-radius:23px;background:#fffdf7;box-shadow:0 8px 24px rgba(86,55,34,.045)}
.detail-paper p{margin:0 0 15px;color:#755e51;font-size:14px;line-height:1.95;letter-spacing:.025em}
.detail-paper p:last-child{margin-bottom:0}
.detail-paper blockquote{margin:19px 0;padding:12px 0 12px 15px;border-left:2px solid #e9bdc4;color:#9b7469;font-size:15px;line-height:1.8}
.detail-section{margin-top:20px}
.detail-section h2{margin:0 0 10px;color:#886c5b;font-size:16px;font-weight:400;letter-spacing:.07em}
.recall-note{padding:14px 17px;border:1px solid #eadbd0;border-radius:18px;background:#faf0e5}
.recall-note p{margin:0;color:#866b5d;font-size:12px;line-height:1.85}
.trace-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.trace-chips span{padding:5px 8px;border-radius:8px;background:#fffaf4;color:#927568;font-size:10px}
.source-fold{border:1px solid #e3ded7;border-radius:18px;background:#fffdf7;padding:0 16px}
.source-fold summary{cursor:pointer;padding:14px 0;color:#876b5c;font-size:12px}
.source-fold p{margin:0 0 14px;color:#958174;font-size:11px;line-height:1.85}
.detail-related{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid #e4ddd5;border-radius:18px;background:#fffdf7;color:#7d6659;font-size:12px}
.detail-related small{display:block;margin-top:5px;color:#a18c7f;font-size:10px;line-height:1.6}
.detail-related i{font-style:normal;color:#9eb7c4;font-size:17px}
.detail-preview-note{margin:20px 8px 0;text-align:center;color:#a89382;font-size:9px;line-height:1.7}
</style>
