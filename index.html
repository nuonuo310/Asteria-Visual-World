<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ef">
  <title>Asteria · Home Visual Prototype</title>
  <link rel="stylesheet" href="./styles.css?v=20260917-1">
  <link rel="stylesheet" href="./home-finish-study.css?v=20260917-1">
  <link rel="stylesheet" href="./home-sync.css?v=20260919-4">
  <link rel="stylesheet" href="./home-hero-balance.css?v=20260919-1">
</head>
<body>
  <main class="app-shell" id="app">
    <header class="topbar" aria-label="Asteria header">
      <div class="theme-lab" aria-label="配色预览切换">
        <button class="theme-chip active" type="button" data-theme-choice="1" aria-label="珍珠暖白">1</button>
        <button class="theme-chip" type="button" data-theme-choice="2" aria-label="雾粉柔白">2</button>
        <button class="theme-chip" type="button" data-theme-choice="3" aria-label="紫灰柔白">3</button>
      </div>
      <div class="brand-wrap"><div class="brand">Asteria</div><div class="brand-star">✦</div></div>
      <div class="weather" aria-label="weather mock"><span class="weather-dot"></span><span>26°C</span></div>
    </header>




    <section class="relationship" aria-label="relationship and calendar">
      <div class="home-hero" aria-label="Shen and Nuo home hero">
        <div class="home-hero-art" aria-hidden="true">
          <img src="./assets/home-hero-shen-nuo.png?v=20260919-2" alt="">
        </div>
        <div class="home-hero-copy">
          <p class="hero-kicker">Shen &amp; Nuo</p>
          <p class="hero-days"><span>相遇</span><strong>256</strong><span>天</span></p>
          <p class="hero-line">把今天，也留在我们这里。</p>
        </div>
      </div>
      <button class="relationship-caption" id="calendarToggle" type="button" aria-expanded="false"><span class="caption-sign">Still becoming.</span><span class="caption-days">Our days</span><span class="calendar-mark" aria-hidden="true">⌄</span></button>
